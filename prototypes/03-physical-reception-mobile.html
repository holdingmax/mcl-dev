<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Recepcion Fisica - Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: { extend: { colors: { 'mcl-blue': '#1e40af', 'mcl-light': '#3b82f6' } } }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen max-w-md mx-auto">
  <!-- Mobile Header -->
  <header class="bg-mcl-blue text-white shadow-lg sticky top-0 z-50">
    <div class="px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="01-warehouse-dashboard.html" class="text-white/70">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </a>
        <div>
          <h1 class="text-sm font-bold">Recepcion Fisica</h1>
          <p class="text-xs text-white/70 font-mono">057-12345678</p>
        </div>
      </div>
      <div class="text-right">
        <p class="text-lg font-bold">12/45</p>
        <p class="text-xs text-white/70">piezas</p>
      </div>
    </div>
    <!-- Progress bar -->
    <div class="h-1 bg-white/20">
      <div class="h-full bg-green-400" style="width: 27%"></div>
    </div>
  </header>

  <main class="px-4 py-4 pb-32">
    <!-- Reception Mode Toggle (mobile) -->
    <div class="flex bg-white border border-gray-200 rounded-lg overflow-hidden mb-4">
      <button class="flex-1 px-3 py-2.5 text-sm font-medium bg-mcl-blue text-white text-center">
        Pieza por Pieza
      </button>
      <button class="flex-1 px-3 py-2.5 text-sm font-medium text-gray-600 text-center">
        Receive All
      </button>
    </div>

    <!-- Receive All panel (shown when Receive All selected) -->
    <div class="bg-white rounded-xl border-2 border-amber-200 p-4 mb-4 shadow-sm hidden" id="receive-all-mobile">
      <h3 class="font-semibold text-gray-800 mb-1 text-sm">Receive All - 33 piezas restantes</h3>
      <p class="text-xs text-gray-400 mb-3">Peso por pieza: <span class="font-mono font-bold text-gray-700">28.83 kg</span> (951.3 / 33)</p>

      <label class="block text-xs text-gray-500 mb-1 font-medium">Dimension promedio (cm) *</label>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <input type="number" inputmode="numeric" placeholder="Largo" class="border-2 border-gray-200 rounded-xl px-2 py-3 text-lg font-mono text-center focus:outline-none focus:border-mcl-blue">
        <input type="number" inputmode="numeric" placeholder="Ancho" class="border-2 border-gray-200 rounded-xl px-2 py-3 text-lg font-mono text-center focus:outline-none focus:border-mcl-blue">
        <input type="number" inputmode="numeric" placeholder="Alto" class="border-2 border-gray-200 rounded-xl px-2 py-3 text-lg font-mono text-center focus:outline-none focus:border-mcl-blue">
      </div>

      <button class="w-full bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700 active:scale-95">
        Registrar 33 piezas
      </button>
    </div>

    <!-- Current piece card -->
    <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
      <div class="text-center mb-4">
        <span class="text-xs text-gray-400">Registrando</span>
        <h2 class="text-2xl font-bold text-gray-800">Pieza #13</h2>
      </div>

      <div class="space-y-4">
        <!-- Weight - large input for mobile -->
        <div>
          <label class="block text-xs text-gray-500 mb-1 font-medium">Peso (kg) *</label>
          <input type="number" step="0.01" inputmode="decimal" placeholder="0.00"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-4 text-2xl font-mono text-center focus:outline-none focus:border-mcl-blue">
        </div>

        <!-- Dimensions row -->
        <div>
          <label class="block text-xs text-gray-500 mb-1 font-medium">Dimensiones (cm)</label>
          <div class="grid grid-cols-3 gap-2">
            <input type="number" inputmode="numeric" placeholder="Largo"
              class="border-2 border-gray-200 rounded-xl px-2 py-3 text-lg font-mono text-center focus:outline-none focus:border-mcl-blue">
            <input type="number" inputmode="numeric" placeholder="Ancho"
              class="border-2 border-gray-200 rounded-xl px-2 py-3 text-lg font-mono text-center focus:outline-none focus:border-mcl-blue">
            <input type="number" inputmode="numeric" placeholder="Alto"
              class="border-2 border-gray-200 rounded-xl px-2 py-3 text-lg font-mono text-center focus:outline-none focus:border-mcl-blue">
          </div>
        </div>

        <!-- Piece type -->
        <div>
          <label class="block text-xs text-gray-500 mb-1 font-medium">Tipo de pieza</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="ptype" value="SKID" class="peer hidden" checked>
              <div class="border-2 border-gray-200 peer-checked:border-mcl-blue peer-checked:bg-blue-50 rounded-lg py-2 text-center text-xs font-medium transition-all">SKID</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="ptype" value="Bolsa" class="peer hidden">
              <div class="border-2 border-gray-200 peer-checked:border-mcl-blue peer-checked:bg-blue-50 rounded-lg py-2 text-center text-xs font-medium transition-all">Bolsa</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="ptype" value="Crate" class="peer hidden">
              <div class="border-2 border-gray-200 peer-checked:border-mcl-blue peer-checked:bg-blue-50 rounded-lg py-2 text-center text-xs font-medium transition-all">Crate</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="ptype" value="DContainer" class="peer hidden">
              <div class="border-2 border-gray-200 peer-checked:border-mcl-blue peer-checked:bg-blue-50 rounded-lg py-2 text-center text-xs font-medium transition-all">DContainer</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="ptype" value="Oversize" class="peer hidden">
              <div class="border-2 border-gray-200 peer-checked:border-mcl-blue peer-checked:bg-blue-50 rounded-lg py-2 text-center text-xs font-medium transition-all">Oversize</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="ptype" value="Otro" class="peer hidden">
              <div class="border-2 border-gray-200 peer-checked:border-mcl-blue peer-checked:bg-blue-50 rounded-lg py-2 text-center text-xs font-medium transition-all">Otro</div>
            </label>
          </div>
        </div>

        <!-- Condition toggle -->
        <div>
          <label class="block text-xs text-gray-500 mb-2 font-medium">Condicion</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="cond" value="ok" class="peer hidden" checked>
              <div class="border-2 border-gray-200 peer-checked:border-green-500 peer-checked:bg-green-50 rounded-xl py-3 text-center transition-all">
                <svg class="w-6 h-6 mx-auto text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <span class="text-sm font-medium text-green-700">OK</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cond" value="damaged" class="peer hidden">
              <div class="border-2 border-gray-200 peer-checked:border-red-500 peer-checked:bg-red-50 rounded-xl py-3 text-center transition-all">
                <svg class="w-6 h-6 mx-auto text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                </svg>
                <span class="text-sm font-medium text-red-700">Danada</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Quick note -->
        <div>
          <input type="text" placeholder="Nota rapida (opcional)..."
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-mcl-blue">
        </div>
      </div>
    </div>

    <!-- Last 3 pieces (collapsed) -->
    <div class="mt-4">
      <button class="w-full text-left text-xs text-gray-500 font-medium mb-2 flex items-center justify-between">
        <span>Ultimas piezas registradas</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <div class="space-y-2">
        <div class="bg-white rounded-lg border border-gray-100 px-3 py-2 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold text-gray-400">#12</span>
            <span class="text-sm font-mono">28.5kg</span>
            <span class="text-xs text-gray-400">60x40x35</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-green-600 font-medium">OK</span>
            <button class="p-1 text-gray-400 hover:text-mcl-blue" title="Editar pieza">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="bg-white rounded-lg border border-gray-100 px-3 py-2 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold text-gray-400">#11</span>
            <span class="text-sm font-mono">32.1kg</span>
            <span class="text-xs text-gray-400">80x50x40</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-green-600 font-medium">OK</span>
            <button class="p-1 text-gray-400 hover:text-mcl-blue" title="Editar pieza">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="bg-white rounded-lg border border-gray-100 px-3 py-2 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold text-gray-400">#10</span>
            <span class="text-sm font-mono">15.8kg</span>
            <span class="text-xs text-gray-400">45x35x30</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-red-600 font-medium">Danada</span>
            <button class="p-1 text-gray-400 hover:text-mcl-blue" title="Editar pieza">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Fixed bottom action -->
  <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 p-4 shadow-lg">
    <button class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition-colors flex items-center justify-center gap-2 active:scale-95">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      Registrar Pieza
    </button>
  </div>
</body>
</html>
