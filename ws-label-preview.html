<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>WS Label Preview</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0 }
body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center }
h1.title { width: 100%; text-align: center; font-size: 18pt; color: #333; margin-bottom: 10px }
p.subtitle { width: 100%; text-align: center; font-size: 10pt; color: #888; margin-bottom: 20px }
.label-wrapper { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border-radius: 4px; overflow: hidden }
.label-info { background: #1e3a5f; color: #fff; padding: 6px 12px; font-size: 8pt; display: flex; justify-content: space-between; gap: 12px }
.label { width: 12cm; height: 15cm; padding: .35cm .4cm; display: flex; flex-direction: column; overflow: hidden; background: #fff }
hr { border: none; border-top: 1.5px solid #000; margin: .18cm 0 }
.header { display: flex; justify-content: space-between; align-items: flex-start }
.hl img { height: 2.7cm; object-fit: contain }
.meta { font-size: 7.5pt; margin-top: .1cm; line-height: 1.5 }
.wh-row { font-size: 7.5pt; margin-bottom: .1cm }
.wh-num { font-size: 10.5pt; font-weight: 700 }
.mid { display: flex; justify-content: space-between; align-items: stretch; margin-bottom: .1cm }
.client-block { flex: 1 }
.client-name { font-size: 15pt; font-weight: 700; line-height: 1.3 }
.services { font-size: 7.5pt; color: #555; margin-top: .1cm; line-height: 1.4 }
.piece { border: 2.5px solid #000; min-width: 1.5cm; display: flex; align-items: center; justify-content: center; font-size: 22pt; font-weight: 900; margin-left: .2cm; padding: 0 .2cm }
.po-sec { margin-bottom: .06cm }
.po-lbl { font-size: 7.5pt; margin-bottom: .03cm }
.po-num { display: flex; align-items: baseline; gap: .1cm }
.po-suf { font-size: 28pt; font-weight: 900; line-height: 1 }
.pw { display: flex; justify-content: space-between; align-items: baseline }
.pw-n { font-size: 18pt; font-weight: 700 }
.pw-w { font-size: 20pt; font-weight: 700 }
.bc { margin-top: auto; flex-shrink: 0; display: flex; justify-content: center }
.bc svg { max-width: 100% }
.extra-info { display: flex; gap: .5cm; font-size: 12pt; margin-top: .3cm }
</style>
</head>
<body>
<h1 class="title">WS Label Preview</h1>
<p class="subtitle">Etiquetas ejemplo por cada Service Order</p>

<script>
const SERVICE_LABELS = {
  screening_k9: 'Screening K9',
  screening_xray: 'Screening X-Ray',
  screening_manual: 'Screening Manual',
  transport: 'Transport',
  storage: 'Storage',
  in_out: 'In/Out',
  repack: 'Repack',
  dg_inspection: 'DG Inspection',
  handling_storage_fee: 'Handling/Storage Fee',
}

const ORDERS = [
  { so: 'SO-260522-0001', wr: 'WS-000001', client: 'MERFLEX INTERNATIONAL LLC', awb: '044-55512345', po: 'PO-2025-100', qty: 2, weight: 150.0, status: 'received',
    services: ['in_out', 'storage', 'screening_k9'] },
  { so: 'SO-260522-0002', wr: 'WS-000002', client: 'MERFLEX INTERNATIONAL LLC', awb: '', po: 'PO-2025-201', qty: 5, weight: 320.0, status: 'received',
    services: ['in_out', 'storage', 'transport'] },
  { so: 'SO-260522-0003', wr: 'WS-000003', client: 'MERFLEX INTERNATIONAL LLC', awb: '044-12345678', po: 'REF-001', qty: 3, weight: 85.5, status: 'received',
    services: ['in_out', 'screening_xray', 'repack'] },
  { so: 'SO-260522-0004', wr: 'WS-000004', client: 'MERFLEX INTERNATIONAL LLC', awb: '', po: 'REF-002', qty: 10, weight: 500.0, status: 'pending',
    services: ['in_out', 'storage', 'dg_inspection', 'transport'] },
  { so: 'SO-260522-0005', wr: '(sin WR)', client: 'MERFLEX INTERNATIONAL LLC', awb: '369-98765432', po: '', qty: 1, weight: 22.0, status: 'pending',
    services: ['in_out', 'screening_k9', 'transport'] },
]

const now = new Date()
const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}/${now.getFullYear()}`
const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`

function makeBarcode(data) {
  try {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    JsBarcode(svg, data, { format: 'CODE128', width: 2.2, height: 90, fontSize: 11, margin: 4, displayValue: true })
    return svg.outerHTML
  } catch { return '<div style="font-size:10pt;color:#999">[' + data + ']</div>' }
}

let html = ''
for (const o of ORDERS) {
  const whNum = o.wr.replace(/^WS-/, '')
  const barcodeData = o.wr + '01'
  const servicesText = o.services.map(s => SERVICE_LABELS[s] || s).join(' | ')

  html += `
  <div class="label-wrapper">
    <div class="label-info">
      <span>${o.so}</span>
      <span>${o.wr}</span>
      <span>${o.status}</span>
    </div>
    <div class="label">
      <div class="header">
        <div class="hl">
          <img src="https://wms-mcl.web.app/logo.png" />
          <div class="meta">
            <div><b>FROM:</b> MIA</div>
            <div><b>DATE:</b> ${dateStr}</div>
            <div><b>TIME:</b> ${timeStr}</div>
          </div>
        </div>
        <div class="dest"></div>
      </div>
      <hr/>
      <div class="wh-row">
        <span class="wh-lbl">Warehouse No.</span>
        <span class="wh-num">${whNum}</span>
      </div>
      <div class="mid">
        <div class="client-block">
          <div class="client-name">${o.client}</div>
          <div class="services">${servicesText}</div>
        </div>
        <div class="piece">${String(o.qty).padStart(2,'0')}</div>
      </div>
      <hr/>
      <div class="po-sec">
        <div class="po-lbl"><b>SO#</b></div>
        <div class="po-num">
          <span class="po-suf">${o.so}</span>
        </div>
        <div class="extra-info">
          ${o.po ? '<span><b>PO:</b> ' + o.po + '</span>' : ''}
          ${o.awb ? '<span><b>AWB:</b> ' + o.awb + '</span>' : ''}
        </div>
      </div>
      <hr/>
      <div class="pw">
        <div><span class="pw-n">${o.qty}</span> Pcs.</div>
        <div class="pw-w">${o.weight.toFixed(1)} KG</div>
      </div>
      <div class="bc">${makeBarcode(barcodeData)}</div>
    </div>
  </div>`
}
document.body.insertAdjacentHTML('beforeend', html)
</script>
</body></html>
